<!DOCTYPE html>
<html
   xmlns:th="http://www.thymeleaf.org"
   xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
   
<head>
	<th:block th:insert="~{fragments/head.html :: head('신고 관리')}"></th:block>
	<script type="text/javascript">
		$(async function() {
			const { sortType, sortValue, order, page } = setFormValuesFromUrl(); // 로드 시 현재 상태 쿼리스트링 체크
			switch(sortType) {
				case '1': // search
					await getSearchList(null, '/report/info/search_report_list', sortValue, order, page);
					break;
					
				case '2': // select
					await getList('/report/info/get_report_list_by_category', sortValue, order, page);
					break;

				default: 
					await getList('/report/info/get_report_list', sortValue, order, page);
			}
			
			// report category 가져오기
			await getCategoryList('br_category_no'); // element id, form 종류, selectedValue
        });
	</script>
</head>

<body>
	<main class="contents_wrap">
		<header th:replace="~{fragments/header.html :: header}"></header>
	
		<article class="contents_container">
			<nav th:replace="~{fragments/nav.html :: nav}"></nav>
			
			<div class="content">
                <div class="content_inner sc">
					<section class="content_info_wrap">
					    <div class="content_top">
					        <div class="content_top_info">
					            <h2 class="title categoty_title">신고 관리</h2>
					            
					            <div class="content_top_right">
									<form name="search_form" onsubmit="getSearchList(event, '/report/info/search_qna_list')">
										<th:block th:insert="~{fragments/search.html :: search('신고 관리')}"></th:block>
									</form>
						            
						            <div class="btn_list">
						            	<div class="btns white small" onclick="getList('/report/info/get_report_list', null, null, 1, true);">전체보기</div>
						            </div>
					            </div>
					        </div>
					    </div>
					    
					    <div class="table_wrap">
	                        <table class="content_table report_list_table">
	                            <colgroup>
	                                <col class="col_no">
	                                <col class="col_short">
	                                <col class="col_state">
	                                <col>
	                                <col class="col_short">
	                                <col class="col_short">
	                                <col class="col_short">
	                            </colgroup>
	
	                            <thead>
	                                <tr>	                                    
	                                    <th>
	                                        <p class="table_title">No</p>
	                                    </th>
	                                    
	                                    <th>
	                                        <div class="table_title select br_category_no_select" id="br_category_no" onclick="setSelectOptionTopggle(event)">신고 유형</div>
	                                    </th>
	                                    
	                                    <th>
	                                    	<p data-current-sort-value="all" class="table_title sort"
	                                        	onclick="getSortList(event, 'board_report', 'br_state')">
	                                        	상태
	                                        	<span class="sort_icon"></span>
	                                        </p>
	                                    </th>
	                                    
	                                    <th>
	                                        <p class="table_title">제목</p>
	                                    </th>
	                                    
	                                    <th>
	                                        <p class="table_title">신고자</p>
	                                    </th>
	                                    
	                                    <th>
	                                    	<p data-current-sort-value="all" class="table_title sort"
	                                        	onclick="getSortList(event, 'board_report', 'br_reg_date')">
	                                        	등록일
	                                        	<span class="sort_icon"></span>
	                                        </p>
	                                    </th>
	                                    
	                                    <th>
	                                    	<p data-current-sort-value="all" class="table_title sort"
	                                        	onclick="getSortList(event, 'board_report', 'br_mod_date')">
	                                        	수정일
	                                        	<span class="sort_icon"></span>
	                                        </p>
	                                    </th>
	                                </tr>
	                            </thead>
	
	                            <tbody>
	                                <!-- 리스트 테이블 -->
	                            </tbody>
	                        </table>
	                        
	                        <div class="pagination_wrap"></div>
	                    </div>
					</section>
                </div>
            </div>
		</article>
	</main>
</body>
</html>
