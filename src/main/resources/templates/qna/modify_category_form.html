<!DOCTYPE html>
<html
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
   
<head>
	<th:block th:insert="~{fragments/head.html :: head('질문 분류 수정')}"></th:block>
</head>

<body>
	<main class="contents_wrap">
		<header th:replace="~{fragments/header.html :: header}"></header>
	
		<article class="contents_container">
			<nav th:replace="~{fragments/nav.html :: nav}"></nav>
			
			<div class="content">
                <div class="content_inner sc">
					<section class="content_info_wrap">
						<div class="content_top">
					        <div class="content_top_info">
					            <h2 class="title">질문 분류 관리</h2>
					        </div>
				            <p class="sub_title">질문 분류 수정</p>
					    </div>
					    
					    <form name="qna_category_modify_form">					    	
                      		<input type="hidden" name="bqc_no" th:value="${qnaCategoryDto.bqc_no}">
                      		<input type="hidden" name="current_bqc_name" th:value="${qnaCategoryDto.bqc_name}">
                      		
						    <div class="table_wrap">
		                        <table class="content_edit_table">
		                            <colgroup>
	                                    <col class="col_row_title">
	                                    <col>
	                                    <col class="col_row_title">
	                                    <col>
	                                </colgroup>
	                                
		                            <tbody>
		                                <tr>
		                                	<th><p class="table_title">분류명</p></th>
		                                	<td>
		                                		<input type="text" name="bqc_name" id="bqc_name" class="table_info" placeholder="질문 유형 분류명"
		                                			th:onblur="requestDuplicateCheck(this, true, [[${qnaCategoryDto.bqc_name}]], null);"
		                                			th:value="${qnaCategoryDto.bqc_name}">
	                                        </td>
	                                        
	                                        <th><p class="table_title">등록일<span class="divider"></span>수정일</p></th>
	                                        <td class="disabled">
	                                        	<p class="table_info" th:utext="|
	                                        		${qnaCategoryDto.bqc_reg_date}
	                                        		<span class='divider'></span>
	                                        		${qnaCategoryDto.bqc_mod_date}
	                                        	|"></p>
	                                        </td>
		                                </tr>
		                                
		                                <tr>	                                        
	                                        <th><p class="table_title">질문 수</p></th>
	                                        <td class="disabled">
	                                        	<p class="table_info" th:text="${qnaCategoryDto.bqc_item_cnt}"></p>
	                                        </td>
	                                        
	                                        <td colspan="2"></td>
		                                </tr>
		                            </tbody>
		                        </table>
		                        
		                        <div class="btn_list">
		                        	<div th:onclick="delSingleData(
                       			 		[[${qnaCategoryDto.bqc_name}]], 
                       			 		'bqc_no', 
                       			 		[[${qnaCategoryDto.bqc_no}]]
                       			 	)" class="btns delete">삭제</div>
		                        		 
	                                <div class="btn_list">
	                                    <a href="javascript: history.back();" class="btns cancel">뒤로가기</a>
	                                    <div onclick="putQnaCategoryModify('qna_category_modify_form')" class="btns">수정</div>
	                                </div>
	                            </div>
		                    </div>
	                    </form>
					</section>
                </div>
            </div>
		</article>
	</main>
</body>
</html>
