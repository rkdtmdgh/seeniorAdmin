<!DOCTYPE html>
<html
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	
<head>
	<th:block th:insert="~{fragments/head.html :: head('공지 사항 등록')}"></th:block>
	<script th:inline="javascript">
		$(function() {			
			// 작성자 no 값 설정
			setLoginUserInfoInputValue('n_writer_no', 'a_no');
			
			// 가이드라인 설정
			setSelectGuidelineInfo();
		});
	</script>
</head>

<body>
	<main class="contents_wrap">
		<header th:replace="~{fragments/header.html :: header}"></header>
	
		<article class="contents_container">
			<nav th:replace="~{fragments/nav.html :: nav}"></nav>
			
			<div class="content">
                <div class="content_inner sc">
					<section class="content_info_wrap">
						<div class="content_top">
					        <div class="content_top_info">
					            <h2 class="title">공지 사항</h2>
					        </div>
				            <p class="sub_title">공지 사항 등록</p>
					    </div>
					    
						<form name="notice_reg_form">					    	
                       		<input type="hidden" name="n_writer_no">
                       		
						    <div class="table_wrap mb_stepGap">
		                        <table class="content_edit_table">
		                            <colgroup>
	                                    <col class="col_row_title">
	                                    <col>
	                                    <col class="col_row_title">
	                                    <col>
	                                </colgroup>
	                                
		                            <tbody>
		                                <tr>
	                                        <th><p class="table_title">제목</p></th>
		                                	<td colspan="3">
		                                		<label class="table_info">
			                                		<input type="text" name="n_title" id="n_title" placeholder="제목"
			                                			onblur="validateEmpty(this, '제목')">
		                                		</label>
	                                        </td>
		                                </tr>
		                                
		                                <tr>
		                                	<th><p class="table_title">작성자</p></th>
		                                	<td colspan="3" class="disabled">
		                                		<p class="table_info" th:text="${#authentication.name}"></p>
	                                        </td>
		                                </tr>
		                                
		                                <tr>
		                                	<th>
												<p class="table_title">
		                                			내용
			                                		<span id="guideline"></span>
		                                		</p>
	                                		</th>
		                                	
		                                	<td colspan="3">
	                                			<div id="editor"></div>
	                                			<div id="text_limit">
	                                				<span id="current_size"></span> / <span id="max_size"></span>
	                                			</div>
	                                        </td>
		                                </tr>
		                            </tbody>
		                        </table>
		                        
		                        <div class="btn_list f_jc_right">
	                                <div class="btn_list">
	                                    <div onclick="history.back();" class="btns cancel">뒤로가기</div>
	                                    <div onclick="postNoticeCreate('notice_reg_form')" class="btns">등록</div>
	                                </div>
	                            </div>
		                    </div>
	                    </form>
					</section>
                </div>
            </div>
		</article>
	</main>
</body>
</html>
