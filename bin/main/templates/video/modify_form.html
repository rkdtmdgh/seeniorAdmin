<!DOCTYPE html>
<html 
	xmlns:th="http://www.thymeleaf.org" 
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	
<head>
    <th:block th:insert="~{fragments/head.html :: head('영상 정보 수정')}"></th:block>
</head>

<body>
	<main class="contents_wrap">
	    <header th:replace="~{fragments/header.html :: header}"></header>
	
	    <article class="contents_container">
	        <nav th:replace="~{fragments/nav.html :: nav}"></nav>
	
	        <div class="content">
	            <div class="content_inner sc">
	                <section class="content_info_wrap">
	                    <div class="content_top">
	                        <div class="content_top_info">
	                            <h2 class="title">영상 정보 관리</h2>
	                        </div>
	                        <p class="sub_title">영상 정보 수정</p>
	                    </div>
	
	                    <form name="video_modify_form">
                            <input type="hidden" name="v_no" th:value="${videoDto.v_no}">
                            
	                        <div class="table_wrap">
	                            <table class="content_edit_table">
	                                <colgroup>
	                                    <col class="col_row_title">
	                                    <col>
	                                    <col class="col_row_title">
	                                    <col>
	                                </colgroup>
	
	                                <tbody>
		                                <tr>
		                                    <th><p class="table_title">제목</p></th>
		                                    <td colspan="3">
		                                    	<label class="table_info">
			                                        <input type="text" name="v_title" id="v_title" placeholder="제목"
			                                            onblur="validateEmpty(this, '제목');"
			                                            th:value="${videoDto.v_title}">
		                                    	</label>
		                                    </td>
		                                </tr>
		                                
		                                <tr>
		                                	<th><p class="table_title">등록일<span class="divider"></span>수정일</p></th>
	                                        <td colspan="3" class="disabled">
	                                        	<p class="table_info" th:utext="|
	                                        		${videoDto.v_reg_date}
	                                        		<span class='divider'></span>
	                                        		${videoDto.v_mod_date}
	                                        	|"></p>
	                                        </td>
										</tr>
										
		                                <tr>
		                                    <th><p class="table_title">URL</p></th>
		                                    <td colspan="3">
		                                    	<label class="table_info">
			                                		<input type="text" name="v_link" id="v_link" placeholder="URL"
		                                				onblur="validateVideo(this)"
		                                				th:value="${videoDto.v_link}">
	                                				<div class="preview_container">
	                                					<iframe frameborder="0" allowfullscreen="true" th:src="${videoDto.v_link}">)</iframe>
	                                				</div>
	                                				<input type="hidden" name="v_platform" th:value="${videoDto.v_platform}">
		                                    	</label>
		                                    </td>
		                                </tr>
		                                
		                                <tr>
		                                    <th><p class="table_title">내용</p></th>	                                        
	                                        <td colspan="3">	         
	                                        	<div class="table_info">                                   	
	                                            	<textarea name="v_text" id="v_text" class="table_textarea" placeholder="내용을 입력하세요"
		                                				data-limit-target="textarea" 
		                                				data-limit="short" 
		                                				oninput="setTextareaAutoHeight(this)" 
		                                				onkeyup="setTextLimit(this)"
		                                				onblur="validateEmpty(this, '내용')"
		                                				th:text="${videoDto.v_text}"></textarea>
	                                            	<div id="text_limit">
		                                				<span id="current_size"></span> / <span id="max_size"></span>
		                                			</div>
	                                			</div>
		                                    </td>
		                                </tr>
	                                </tbody>
	                            </table>
	
	                            <div class="btn_list">
	                            	<div class="btns delete"
		                        		 th:onclick="delListData('v_no')">삭제</div>
		                        		 
	                                <div class="btn_list">
	                                    <a href="javascript: history.back();" class="btns cancel">뒤로가기</a>
	                                    <div onclick="putVideoModify('video_modify_form')" class="btns">수정</div>
	                                </div>
	                            </div>
	                        </div>
	                    </form>
	                </section>
	            </div>
	        </div>
	    </article>
	</main>
</body>
</html>
